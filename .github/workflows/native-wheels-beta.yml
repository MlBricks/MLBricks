name: Native wheels beta

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  MLBRICKS_VERSION: "1.0.0b1"
  TORCH_VERSION: "2.10.0"
  CUDA_VERSION: "12.8.1"
  PYTORCH_CUDA_INDEX: "https://download.pytorch.org/whl/cu128"
  # Fat CUDA binary: Volta -> Turing -> Ampere -> Ada -> Hopper -> Blackwell.
  TORCH_CUDA_ARCH_LIST: "7.0;7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"
  MAX_JOBS: "2"
  MLBRICKS_NATIVE_LINEINFO: "0"

jobs:
  portable:
    name: Portable wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build portable artifacts
        shell: bash
        env:
          MLBRICKS_BUILD_CORE_NATIVE: "0"
          MLBRICKS_BUILD_BOLT_NATIVE: "0"
          MLBRICKS_BUILD_VESA_NATIVE: "0"
          MLBRICKS_BUILD_VISION_NATIVE: "0"
          MLBRICKS_BUILD_FFNBRICK_NATIVE: "0"
          MLBRICKS_BUILD_RESIDUALBRICK_NATIVE: "0"
          MLBRICKS_BUILD_ELASTICBIT_NATIVE: "0"
        run: |
          set -euxo pipefail
          python -m pip install -U build twine "setuptools>=77.0.3" wheel
          rm -rf build dist *.egg-info
          python -m build
          python -m twine check dist/*
          ls -lh dist/
          test -f dist/mlbricks_core-${MLBRICKS_VERSION}-py3-none-any.whl
          test -f dist/mlbricks_core-${MLBRICKS_VERSION}.tar.gz
          python - <<'PY'
          import zipfile, pathlib
          wheel = next(pathlib.Path('dist').glob('*py3-none-any.whl'))
          with zipfile.ZipFile(wheel) as z:
              bad = [n for n in z.namelist() if n.endswith(('.so','.pyd','.dll','.dylib'))]
          assert not bad, bad
          print('Portable wheel contains no compiled binaries: PASS')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist/*
          if-no-files-found: error

  linux-cuda:
    name: Linux CUDA / ${{ matrix.python_abi }}
    runs-on: ubuntu-latest
    container:
      image: pytorch/manylinux2_28-builder:cuda12.8
    strategy:
      fail-fast: false
      matrix:
        python_abi:
          - cp310-cp310
          - cp311-cp311
          - cp312-cp312
          - cp313-cp313
    env:
      PYTHON: /opt/python/${{ matrix.python_abi }}/bin/python
      MLBRICKS_EXPECT_CUDA_NATIVE: "1"
      MLBRICKS_EXPECT_CUDA_VERSION: "12.8"
      MLBRICKS_BUILD_CORE_NATIVE: "1"
      MLBRICKS_BUILD_BOLT_NATIVE: "1"
      MLBRICKS_BUILD_VESA_NATIVE: "0"
      MLBRICKS_BUILD_VISION_NATIVE: "1"
      MLBRICKS_BUILD_FFNBRICK_NATIVE: "1"
      MLBRICKS_BUILD_RESIDUALBRICK_NATIVE: "1"
      MLBRICKS_BUILD_ELASTICBIT_NATIVE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Build Linux fat-CUDA wheel
        shell: bash
        run: |
          set -euxo pipefail
          "$PYTHON" -m pip install -U pip wheel build ninja "setuptools>=77.0.3" "numpy>=1.24"
          "$PYTHON" -m pip install "torch==${TORCH_VERSION}" --index-url "${PYTORCH_CUDA_INDEX}"
          nvcc --version
          "$PYTHON" - <<'PY'
          import torch
          from torch.utils.cpp_extension import CUDA_HOME
          print('torch', torch.__version__, 'cuda', torch.version.cuda, 'CUDA_HOME', CUDA_HOME)
          assert torch.__version__.split('+')[0] == '2.10.0'
          assert torch.version.cuda is not None and torch.version.cuda.startswith('12.8'), torch.version.cuda
          assert CUDA_HOME is not None, 'CUDA_HOME must be detected for CUDA-native release wheels'
          PY
          rm -rf build dist *.egg-info
          "$PYTHON" -m build --wheel --no-isolation
          ls -lh dist/
          "$PYTHON" - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          size_mib = wheel.stat().st_size / 1024**2
          print('wheel:', wheel.name, f'{size_mib:.2f} MiB')
          assert size_mib < 100.0, f'PyPI default per-file limit is 100 MiB; wheel is {size_mib:.2f} MiB'
          assert 'linux_x86_64' in wheel.name, wheel.name
          with zipfile.ZipFile(wheel) as z:
              bins = [n for n in z.namelist() if n.endswith('.so')]
          expected = ['mlbricks/_C', 'mlbricks/_gauss_cuda', 'mlbricks/_vision_native',
                      'mlbricks/ffnbrick/_C', 'mlbricks/residualbrick/_C', 'mlbricks/elasticbit/_C']
          missing = [x for x in expected if not any(x in b for b in bins)]
          assert not missing, missing
          print('All six Linux native extensions packaged: PASS')
          PY
      - name: Import Linux native extensions
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/mlbricks-wheel-test
          "$PYTHON" -m pip install --no-deps --target /tmp/mlbricks-wheel-test dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/mlbricks-wheel-test "$PYTHON" - <<'PY'
          import importlib, mlbricks
          print('mlbricks', mlbricks.__version__, mlbricks.__file__)
          for name in ['mlbricks._C','mlbricks._gauss_cuda','mlbricks._vision_native',
                       'mlbricks.ffnbrick._C','mlbricks.residualbrick._C','mlbricks.elasticbit._C']:
              importlib.import_module(name)
              print('IMPORT PASS', name)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: linux-cuda-${{ matrix.python_abi }}
          path: dist/*.whl
          if-no-files-found: error

  windows-cuda:
    name: Windows CUDA / Python ${{ matrix.python }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MAX_JOBS: "1"
      MLBRICKS_EXPECT_CUDA_NATIVE: "1"
      MLBRICKS_EXPECT_CUDA_VERSION: "12.8"
      MLBRICKS_BUILD_CORE_NATIVE: "1"
      MLBRICKS_BUILD_BOLT_NATIVE: "1"
      MLBRICKS_BUILD_VESA_NATIVE: "0"
      MLBRICKS_BUILD_VISION_NATIVE: "1"
      MLBRICKS_BUILD_FFNBRICK_NATIVE: "1"
      MLBRICKS_BUILD_RESIDUALBRICK_NATIVE: "1"
      MLBRICKS_BUILD_ELASTICBIT_NATIVE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CUDA 12.8 toolkit
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: "12.8.1"
          log-file-suffix: "py${{ matrix.python }}.txt"
      - name: Build Windows fat-CUDA wheel
        shell: pwsh
        run: |
          python -m pip install -U pip wheel build ninja "setuptools>=77.0.3" "numpy>=1.24"
          python -m pip install "torch==$env:TORCH_VERSION" --index-url $env:PYTORCH_CUDA_INDEX
          nvcc --version
          python -c "import torch; from torch.utils.cpp_extension import CUDA_HOME; print('torch',torch.__version__,'cuda',torch.version.cuda,'CUDA_HOME',CUDA_HOME); assert torch.__version__.split('+')[0] == '2.10.0'; assert torch.version.cuda is not None and torch.version.cuda.startswith('12.8'); assert CUDA_HOME is not None"
          Remove-Item -Recurse -Force build,dist -ErrorAction SilentlyContinue
          Get-ChildItem -Directory -Filter '*.egg-info' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          python -m build --wheel --no-isolation
          Get-ChildItem dist
          @'
          from pathlib import Path
          import zipfile
          w = next(Path('dist').glob('*.whl'))
          s = w.stat().st_size / 1024**2
          print(w.name, f'{s:.2f} MiB')
          assert s < 100.0, f'PyPI default per-file limit is 100 MiB; wheel is {s:.2f} MiB'
          assert 'win_amd64' in w.name, w.name
          with zipfile.ZipFile(w) as z:
              bins = [n for n in z.namelist() if n.endswith('.pyd')]
          expected = ['mlbricks/_C', 'mlbricks/_gauss_cuda', 'mlbricks/_vision_native',
                      'mlbricks/ffnbrick/_C', 'mlbricks/residualbrick/_C', 'mlbricks/elasticbit/_C']
          missing = [x for x in expected if not any(x in b for b in bins)]
          assert not missing, missing
          print('All six Windows native extensions packaged: PASS')
          '@ | python -
      - name: Import Windows native extensions
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'mlbricks-wheel-test'
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $target | Out-Null
          python -m pip install --no-deps --target $target (Get-ChildItem dist\*.whl).FullName
          Push-Location $env:RUNNER_TEMP
          $env:PYTHONPATH = $target
          python -c "import importlib,mlbricks; print('mlbricks',mlbricks.__version__,mlbricks.__file__); [importlib.import_module(x) for x in ['mlbricks._C','mlbricks._gauss_cuda','mlbricks._vision_native','mlbricks.ffnbrick._C','mlbricks.residualbrick._C','mlbricks.elasticbit._C']]; print('Windows native imports: PASS')"
          Pop-Location
      - uses: actions/upload-artifact@v7
        with:
          name: windows-cuda-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  macos-native:
    name: macOS ARM64 native / Python ${{ matrix.python }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MLBRICKS_FORCE_CPU: "1"
      MAX_JOBS: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHFLAGS: "-arch arm64"
      _PYTHON_HOST_PLATFORM: "macosx-11.0-arm64"
      MLBRICKS_BUILD_CORE_NATIVE: "1"
      MLBRICKS_BUILD_BOLT_NATIVE: "0"
      MLBRICKS_BUILD_VESA_NATIVE: "0"
      MLBRICKS_BUILD_VISION_NATIVE: "1"
      MLBRICKS_BUILD_FFNBRICK_NATIVE: "1"
      MLBRICKS_BUILD_RESIDUALBRICK_NATIVE: "1"
      MLBRICKS_BUILD_ELASTICBIT_NATIVE: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build macOS ARM64 native CPU wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -U pip wheel build ninja "setuptools>=77.0.3" "numpy>=1.24" "torch==${TORCH_VERSION}"
          python - <<'PY'
          import platform, torch
          print('machine', platform.machine(), 'torch', torch.__version__)
          assert platform.machine() == 'arm64', platform.machine()
          assert torch.__version__.split('+')[0] == '2.10.0'
          PY
          rm -rf build dist *.egg-info
          python -m build --wheel --no-isolation \
            -C--build-option=bdist_wheel \
            -C--build-option=--plat-name \
            -C--build-option=macosx_11_0_arm64
          ls -lh dist/
          python - <<'PY'
          from pathlib import Path
          import zipfile
          w = next(Path('dist').glob('*.whl'))
          s = w.stat().st_size / 1024**2
          print(w.name, f'{s:.2f} MiB')
          assert s < 100.0, f'PyPI default per-file limit is 100 MiB; wheel is {s:.2f} MiB'
          assert 'macosx_11_0_arm64' in w.name, w.name
          import subprocess, tempfile
          with zipfile.ZipFile(w) as z:
              bins = [n for n in z.namelist() if n.endswith(('.so', '.dylib'))]
              with tempfile.TemporaryDirectory() as td:
                  extracted = []
                  for name in bins:
                      out = Path(td) / Path(name).name
                      out.write_bytes(z.read(name))
                      archs = subprocess.check_output(['lipo', '-archs', str(out)], text=True).strip().split()
                      print(name, 'architectures:', archs)
                      assert archs == ['arm64'], (name, archs)
                      extracted.append(name)
          expected = ['mlbricks/_C', 'mlbricks/_vision_native',
                      'mlbricks/ffnbrick/_C', 'mlbricks/residualbrick/_C']
          missing = [x for x in expected if not any(x in b for b in bins)]
          assert not missing, missing
          print('All four macOS ARM64 native extensions packaged: PASS')
          print('All macOS native binaries are arm64-only: PASS')
          PY
          rm -rf /tmp/mlbricks-wheel-test
          python -m pip install --no-deps --target /tmp/mlbricks-wheel-test dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/mlbricks-wheel-test python - <<'PY'
          import importlib, mlbricks
          for name in ['mlbricks._C','mlbricks._vision_native','mlbricks.ffnbrick._C','mlbricks.residualbrick._C']:
              importlib.import_module(name)
              print('IMPORT PASS', name)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  release-check:
    name: Assemble release artifacts
    runs-on: ubuntu-latest
    needs: [portable, linux-cuda, windows-cuda, macos-native]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate artifact set
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -U twine
          ls -lh dist/
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          files = list(Path('dist').iterdir())
          names = [p.name for p in files]
          assert len(names) == len(set(names)), 'duplicate artifact filenames'
          assert any('py3-none-any.whl' in n for n in names)
          assert any('linux_x86_64.whl' in n for n in names)
          assert any('win_amd64.whl' in n for n in names)
          assert any('macosx' in n and 'arm64' in n and n.endswith('.whl') for n in names)
          assert not any('x86_64' in n and 'macosx' in n for n in names), names
          assert any(n.endswith('.tar.gz') for n in names)
          expected_wheels = 1 + 4 + 4 + 4
          wheel_count = sum(n.endswith('.whl') for n in names)
          assert wheel_count == expected_wheels, (wheel_count, names)
          print('Release artifact matrix: PASS')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-release-artifacts
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish beta to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release-check
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/mlbricks-core
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pypi-release-artifacts
          path: dist
      - name: Require version-matching tag
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v${MLBRICKS_VERSION}"
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
