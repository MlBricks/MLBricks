[build-system]
requires = ["setuptools>=77.0.3", "wheel", "torch>=2.10,<2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbricks-kit"
version = "1.0.0b1"
description = "MLBricks modular neural-network library with uniform auto/native/pytorch dispatch, hierarchical adaptive execution planner, native C++/CUDA vision engines, ESA, Bolt, Gaussian/BoltModel, VisionBolt, VESA, Bricks, FFNBrick, ResidualBrick, SOUP, and ElasticBit."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = [
  "LICENSE.md",
  "LICENSING_NOTICE.md",
  "COMMERCIAL_LICENSE.md",
  "mlbricks/LICENSE_VISUALBOLT.txt",
  "mlbricks/bolt/LICENSE_BOLT.txt",
  "mlbricks/elasticbit/LICENSE_ELASTICBIT.txt",
  "mlbricks/esa/LICENSE_ESA.txt",
  "mlbricks/ffnbrick/LICENSE_FFNBRICK.txt",
  "mlbricks/residualbrick/LICENSE_RESIDUALBRICK.txt",
  "mlbricks/soup/LICENSE_SOUP.txt",
  "mlbricks/vesa/LICENSE_VESA.txt",
]
authors = [
  { name = "Zameer Hussain" },
  { name = "Akhtar Hussain" }
]
keywords = [
  "entangled state attention",
  "Bolt attention",
  "scaled dot-product attention",
  "ESA",
  "vision ESA",
  "VESA",
  "FFNBrick",
  "ResidualBrick",
  "StateAwareFFN",
  "causal language modeling",
  "associative scan",
  "prefix scan",
  "PyTorch",
  "quantization"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "torch>=2.10,<2.11",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pandas>=2",
  "build",
  "twine",
  "ruff>=0.5",
  "tomli>=2.0.1; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/MlBricks/MLBricks"
Repository = "https://github.com/MlBricks/MLBricks"
Issues = "https://github.com/MlBricks/MLBricks/issues"
License = "https://polyformproject.org/licenses/noncommercial/1.0.0"
"Commercial Licensing" = "https://github.com/MlBricks/MLBricks/blob/main/COMMERCIAL_LICENSE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlbricks*"]
exclude = ["tests*", "examples*"]
